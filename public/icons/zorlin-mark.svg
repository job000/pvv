<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Zorlin">
  <defs>
    <linearGradient id="zl-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="zl-mark" x1="120" y1="96" x2="400" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="zl-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(292 248) rotate(90) scale(120)">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="zl-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="118" fill="url(#zl-bg)"/>

  <!-- Subtle grid / horizon -->
  <path d="M64 320c72-40 144-40 216 0s144 40 168 24" stroke="#2dd4bf" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round"/>
  <circle cx="292" cy="248" r="118" fill="url(#zl-glow)"/>

  <!-- Abstract Z / priority path — reads at 16–32px -->
  <g filter="url(#zl-soft)">
    <!-- top bar -->
    <path d="M118 128h236l-52 72H66l52-72Z" fill="url(#zl-mark)"/>
    <!-- diagonal beam -->
    <path d="M318 200 194 384h-70l124-184h70Z" fill="url(#zl-mark)"/>
    <!-- bottom bar -->
    <path d="M158 384h236l-52 72H106l52-72Z" fill="url(#zl-mark)"/>
  </g>

  <!-- Priority node (focus point) -->
  <circle cx="318" cy="248" r="22" fill="#5eead4"/>
  <circle cx="318" cy="248" r="10" fill="#042f2e"/>
</svg>
